#!/bin/bash
# ---------------------------------------------------------------------------
# Oscilla AVR toolchain — build configuration
#
# We rebuild Arduino's avr-gcc 7.3.0-atmel3.6.1-arduino7 from the SAME upstream
# sources and the SAME patches Arduino uses, but targeting **bionic/aarch64**
# instead of glibc, so the binaries run inside an Android app with no external
# ELF interpreter to bundle (see docs/ARDUINO_COMPILER.md §5.4).
#
# Recipe provenance — every version below is pinned to what Arduino actually
# shipped, so the compiler we build is codegen-identical to the Arduino IDE's:
#   https://github.com/arduino/toolchain-avr  (build.conf, gcc.build.bash,
#   binutils.build.bash)                       AVR_VERSION=3.6.1 BUILD=arduino7
# ---------------------------------------------------------------------------

# --- upstream component versions (pinned, do not bump casually) -------------
GCC_VERSION=7.3.0
# Atmel AVR 8-bit GNU Toolchain 3.6.1 ships binutils "2.26.20160125" with AVR
# target modifications. There is no vanilla tarball for it — it only exists as
# Atmel's avr-binutils.tar.bz2.
BINUTILS_LABEL=2.26-atmel3.6.1

# GCC 7.3.0's own contrib/download_prerequisites pins exactly these. Arduino's
# build.conf asks for gmp 5.0.2 / mpfr 3.1.0 / mpc 0.9, but gmp 5.0.2 (2011)
# predates aarch64 and cannot configure for it at all. These are GCC-blessed,
# aarch64-capable, and are pure compile-time arithmetic libraries: they do not
# influence generated AVR code. The PC dress rehearsal (04-refbuild.sh) proves
# that empirically by reproducing the reference hex byte for byte.
GMP_VERSION=6.1.0
MPFR_VERSION=3.1.4
MPC_VERSION=1.0.3

# --- host target: BIONIC-NATIVE aarch64 via the NDK -------------------------
# Memo §5.4 offers two ways to kill the PT_INTERP dependency: fully-static
# (musl or glibc-static), or bionic-native. It calls static "preferred". That
# preference does not survive contact with LTO, and this is the one real
# finding of the Phase-B toolchain work:
#
#   Arduino's UNO link line is `-flto -fuse-linker-plugin`, and the archive
#   step is `ar rcs --plugin .../liblto_plugin.so`. Both `ld` and `ar` reach
#   the plugin through **dlopen()**. A fully static binary cannot dlopen:
#   musl's static libc stubs dlopen() to unconditionally fail, and static
#   glibc's dlopen only works if the exact matching shared glibc is present on
#   the machine — which on Android it never is. So a static build forces
#   `-fno-use-linker-plugin` + `-ffat-lto-objects`, which changes which symbols
#   LTO may internalise (the linker no longer feeds -fresolution back), which
#   changes codegen, which breaks byte-identity with Arduino IDE output. That
#   byte-identity is the property the whole spike was run to establish.
#
# Bionic-native loses nothing in exchange. Its PT_INTERP is
# `/system/bin/linker64` — an absolute path that exists on every Android 64-bit
# device and never moves — so it is exactly as install-path-independent as a
# static binary, while keeping a working dlopen. It is also smaller, and
# ships no third-party libc.
#
# The one consequence: the binaries are dynamically linked against libc++, so
# `libc++_shared.so` ships alongside them in jniLibs and the compiler driver
# sets LD_LIBRARY_PATH=<nativeLibraryDir>. execve'd children are separate
# processes and do not inherit the app's linker namespace, so the env var is
# the only way they find it — and children inherit it, which is all we need.
#
# API 26 == Oscilla's minSdk. NDK r28 is the first NDK to default to 16 KB page
# alignment; -Wl,-z,max-page-size=16384 is passed explicitly regardless
# (memo §5.3, enforced by Play from 1 Feb 2027).
ANDROID_API=26
ANDROID_TRIPLE=aarch64-linux-android
NDK_VERSION=r28c
NDK_URL="https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"

# --- source URLs ------------------------------------------------------------
ATMEL_SOURCES="http://downloads.arduino.cc/tools/opensource/Atmel-AVR-GNU-Toolchain/3.6.1"
ARDUINO_TC_RAW="https://raw.githubusercontent.com/arduino/toolchain-avr/master"
GNU_SOURCES="https://ftp.gnu.org/gnu"

BINUTILS_SRC_URL="${ATMEL_SOURCES}/avr-binutils.tar.bz2"
GCC_SRC_URL="${GNU_SOURCES}/gcc/gcc-${GCC_VERSION}/gcc-${GCC_VERSION}.tar.xz"
GMP_SRC_URL="${GNU_SOURCES}/gmp/gmp-${GMP_VERSION}.tar.bz2"
MPFR_SRC_URL="${GNU_SOURCES}/mpfr/mpfr-${MPFR_VERSION}.tar.bz2"
MPC_SRC_URL="${GNU_SOURCES}/mpc/mpc-${MPC_VERSION}.tar.gz"

GCC_PATCH_URL="${ARDUINO_TC_RAW}/avr-gcc-patches/atmel-patches-gcc.${GCC_VERSION}-arduino2.patch"
BINUTILS_PATCH_URL="${ARDUINO_TC_RAW}/binutils-patches/00-binutils-data_region_length.patch"

# The prebuilt Arduino distribution. We do not run these binaries in the
# product, but every *target* artifact (avr-libc headers, libc.a, libm.a,
# libgcc.a, crt*.o, ldscripts, specs, device-specs) is AVR machine code or
# plain text and is host-independent — lifting it verbatim is what guarantees
# byte-identical output.
ARDUINO_AVR_PREBUILT_URL="https://downloads.arduino.cc/tools/avr-gcc-${GCC_VERSION}-atmel3.6.1-arduino7-x86_64-pc-linux-gnu.tar.bz2"
ARDUINO_CORE_VERSION=1.8.6
ARDUINO_CORE_URL="https://github.com/arduino/ArduinoCore-avr/archive/refs/tags/${ARDUINO_CORE_VERSION}.tar.gz"

# --- board scope ------------------------------------------------------------
# Phase B ships Arduino UNO only. The multilib and the device it needs:
AVR_MULTILIB=avr5
AVR_DEVICE=atmega328p
# Device I/O headers to keep out of avr/include/avr (28 MB of them upstream).
# io.h fans out to exactly one of these per -mmcu; everything not listed is
# dropped. Keep the whole ATmega328/168/88/48 family plus the classic
# ATmega8/16/32 so a later UNO-compatible board needs no toolchain respin.
AVR_KEEP_IO_HEADERS="iom328p.h iom328pb.h iom328.h iom168.h iom168p.h iom168pb.h \
iom88.h iom88p.h iom88pb.h iom48.h iom48p.h iom48pb.h iom8.h iom16.h iom32.h \
iomx8.h iomxx0_1.h iom640.h iom1280.h iom2560.h iom1281.h iom2561.h iom32u4.h \
iom16u4.h iomxx4.h iom644.h iom644p.h iom324p.h iom164.h"

# --- paths ------------------------------------------------------------------
# Everything is built under WSL's native filesystem. Building on /mnt/c is
# 10-20x slower and breaks symlink/permission semantics the GCC build needs.
: "${AVRTC_ROOT:=$HOME/avrtc}"
DL_DIR="$AVRTC_ROOT/dl"
SRC_DIR="$AVRTC_ROOT/src"
BUILD_DIR="$AVRTC_ROOT/build"
NDK_DIR="$AVRTC_ROOT/ndk/android-ndk-${NDK_VERSION}"
# Native x86_64 avr toolchain. Two jobs: (1) satisfy GCC's configure-time
# assembler feature probes for the Canadian cross via --with-build-time-tools,
# and (2) act as the PC dress rehearsal that proves our sources+patches
# reproduce the reference hex before Android is ever involved.
NATIVE_PREFIX="$AVRTC_ROOT/out/native"
# The shipped aarch64/bionic toolchain.
ANDROID_PREFIX="$AVRTC_ROOT/out/android"
# Lifted-verbatim Arduino prebuilt (source of all target artifacts).
PREBUILT_DIR="$AVRTC_ROOT/prebuilt"
# Final staged payload: jniLibs + assets, ready to copy into the Gradle module.
STAGE_DIR="$AVRTC_ROOT/stage"

# The repo checkout, as seen from WSL.
REPO_WIN="c:/Users/ASUS/Documents/electronic_simulator"
REPO="/mnt/c/Users/ASUS/Documents/electronic_simulator"
# The Gradle module we stage final outputs into. The Kotlin/Gradle side of
# :arduino:toolchain is owned separately; these scripts only ever write
# jniLibs/arm64-v8a/ and assets/.
MODULE="$REPO/arduino/toolchain/src/main"
JNILIBS_DIR="$MODULE/jniLibs/arm64-v8a"
ASSETS_DIR="$MODULE/assets"

# 7 GB of RAM: GCC's C++ front end needs ~1.5 GB per compile job at peak.
: "${MAKE_JOBS:=6}"

# Reference artifact from the spike — the contract our rebuild must honour.
REFERENCE_HEX_MD5=e52c115ebdc2de4a3b0d2668011e1dce
